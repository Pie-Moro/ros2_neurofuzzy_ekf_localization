# Trajectory Controller — Waypoints Configuration
#
# ================================================================
# SESSION 15 — CARDINAL-ONLY INDOOR NAVIGATION CONSTRAINT
# ================================================================
# All waypoint transitions within indoor zones (SW, SC, SE, NW, NC, NE)
# must enforce STRICTLY CARDINAL (90°) movements:
#   • N-S movements: Δx = 0, Δy ≠ 0
#   • E-W movements: Δy = 0, Δx ≠ 0
#   • NO diagonal transitions: both Δx and Δy simultaneously non-zero
#
# Rationale: Reduces heading error uncertainty during GPS-denied phases;
# simplifies ANN training (fewer trajectory patterns) and improves indoor
# localization reliability when relying on momentum + orientation history.
#
# Passes 1, 2, 3 audited (S15): WP77-79 only non-cardinal entry,
# now fixed to cardinal-only path in NC room (WP78: pure N; WP79: pure S).
# ================================================================
# ================================================================
# BUILDING GEOMETRY (verified from SDF — Session 7 naming correction)
# ================================================================
# 6 rooms: 3 south (below E-W divider walls) + 3 north (above E-W divider walls)
#
#  ┌──────────────┬────────────────┬──────────────┐
#  │  North-West  │  North-Center  │  North-East  │
#  │  [Door A2 ↕] │  Accessible:   │  [Door B2 ↕] │
#  │  [Door C2 ←→]│  via C2 & C1   │  [Door C1 ←→]│
#  ├──────────────┼────────────────┼──────────────┤
#  │  South-West  │  South-Center  │  South-East  │
#  │  [Door A ←→] │  [MAIN ENTRY ↕]│  [Door B ←→] │
#  └──────────────┴────────────────┴──────────────┘
#
#  Legend:  ←→ = E-W crossing (through a N-S vertical wall)
#            ↕  = N-S crossing (through an E-W horizontal wall)
#
# ================================================================
# ALL DOORS — EXACT WORLD FRAME COORDINATES (SDF-verified)
# ================================================================
# South entry  (outer S wall ↕):  x_c= 0.161  y_wall=-4.149  x∈[-0.536,+0.858]
# Door A  (N-S wall west  ←→):   x_wall=-3.501  y_c=-3.466  y∈[-3.916,-3.016]
# Door B  (N-S wall east  ←→):   x_wall=+3.849  y_c=-3.430  y∈[-3.880,-2.980]
# Door A2 (E-W wall west   ↕):   y_wall=+0.211  x_c=-4.741  x∈[-5.191,-4.291]
# Door B2 (E-W wall east   ↕):   y_wall=+0.201  x_c=+4.705  x∈[+4.255,+5.155]
# Door C2 (N-S upper west ←→):   x_wall=-3.510  y_c=+0.902  y∈[+0.452,+1.352]
# Door C1 (N-S upper east ←→):   x_wall=+3.840  y_c=+0.866  y∈[+0.416,+1.316]
