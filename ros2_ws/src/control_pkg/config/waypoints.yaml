#   south half → cross ONLY at y∈[-3.916,-3.016]  (Door A)
#   north half → cross ONLY at y∈[+0.452,+1.352]  (Door C2)
#   ❌ ALL OTHER y VALUES = SOLID WALL
#
# N-S EAST wall (x≈+3.84):
#   south half → cross ONLY at y∈[-3.880,-2.980]  (Door B)
#   north half → cross ONLY at y∈[+0.416,+1.316]  (Door C1)
#   ❌ ALL OTHER y VALUES = SOLID WALL
#
# E-W EAST wall  (y≈+0.201): cross ONLY at x∈[+4.255,+5.155]  (Door B2)
# E-W WEST wall  (y≈+0.211): cross ONLY at x∈[-5.191,-4.291]  (Door A2)
# E-W CENTER     (y≈+0.201, x∈[-3.576,+3.924]): Wall_1 — NEVER CROSS
#
# IMPORTANT: North-half N-S walls are SOLID above y≈+1.352.
#   The old rule "y > +0.28 is safe" was WRONG and has been removed.
#
# ================================================================
# CRASH ROOT CAUSE (confirmed from rosbag, run 4):
#   Old WP (6.50, 0.90) required crossing Wall_12 at x=6.50 — SOLID WALL.
#   Door B2 x_center=4.705 is 1.8m WEST of x=6.50.
#   Fix: approach Door B2 perpendicularly, x=4.705 going north (↕).
#
# ================================================================
# DOOR CROSSING RULES — APPROACH PROTOCOL  (F3 FIX — Session 9):
#   N-S walls (A, B, C1, C2): approach east-west AT the door's y_center
#   E-W walls (A2, B2):       approach north-south AT the door's x_center
#   All crossings must be perpendicular — no diagonal approaches.
#
#   APPROACH WAYPOINTS (new in Session 9):
#   Every door crossing now has THREE waypoints:
#     1. PRE-APPROACH  : same side, 0.50m from wall, at door center
#     2. DOOR          : the wall crossing point (unchanged)
#     3. POST-CROSS    : opposite side, 0.50m from wall, at door center
#
#   This eliminates the Door-B crash (Session 8, run 4):
#   Robot drifted to y=−3.94 (0.51m south of door y_c=−3.43) due to
#   ANN indoor error (mean 7.62m). With pre-approach at (4.35,−3.43),
#   the controller must bring the robot to y≈−3.43 BEFORE reaching
#   the wall, regardless of localization error magnitude.
#
#   Approach offsets used:
#     Door A  (x_wall=−3.501): east pre =−3.00, west post=−4.00
#     Door B  (x_wall=+3.849): west pre =+3.35, east post=+4.35
#     Door A2 (y_wall=+0.211): south pre=−0.30, north post=+0.70
#     Door B2 (y_wall=+0.201): south pre=−0.30, north post=+0.70
#     Door C2 (x_wall=−3.510): east pre =−3.01, west post=−4.01
#
# ================================================================
# SESSION 14 FIX — SOUTH ENTRY x-SHIFT + NORTH CLEARANCE WPs
# ================================================================
# ROOT CAUSE (confirmed from bag 1_0.db3, Session 14):
#   GPS ENU frame has systematic x-offset from /odom: dx = -0.441 ± 0.151m
#   (map_x = odom_x + dx_gps, dx_gps is always negative in this setup).
#
#   Old south-entry WPs at map x=0.16 placed the robot at:
#     odom_x = 0.16 - dx_gps = 0.16 + 0.441 = 0.601m (mean)
#     odom_x worst case (dx=-0.743): 0.16 + 0.743 = 0.903m → wall crash
#   Door gap east edge is at odom x=+0.858m.
#   After WP13 capture, controller turns toward Door B (east heading).
#   Robot drifted east to odom x=0.877 → 0.124m wall penetration.
#   GEOFENCE fired simultaneously → KF1 dead-reckons → oscillation → stuck.
#
#   FIX 1: shift all south entry/exit WPs to map x=-0.28.
#     odom_x = -0.28 + 0.441 = +0.161m (mean = door center)
#     Safe for ALL GPS offset scenarios ±2σ:
#       dx=-0.139 (mean+2σ): odom x=-0.141m  east_margin=0.999m ✓
#       dx=-0.441 (mean):    odom x=+0.161m  east_margin=0.697m ✓
#       dx=-0.285 (S14 run): odom x=+0.005m  east_margin=0.853m ✓
#       dx=-0.743 (mean-2σ): odom x=+0.463m  east_margin=0.395m ✓
#
#   FIX 2: insert NORTH CLEARANCE WP (-0.28, -3.00) after each entry
#     post-cross WP, before the first interior navigation target.
#     After GEOFENCE fires, controller turns NORTH (≈90-122° heading),
#     driving robot away from south wall geometry before turning east/west
#     toward Door B / Door A. Eliminates east jamb collision in all GPS
#     offset scenarios.
#
#   WP30 (0.16, -3.45) is unchanged: it is an INTERIOR SC-room waypoint
#   (transition between Door B return and Door A approach), NOT a south
#   entry waypoint. GPS x-offset does not cause wall collision there.
#
#   Changes: 21 WPs shifted + 3 north-clearance WPs inserted = 131 total.
# ================================================================
#
# VALIDATION: 131 waypoints, 0 wall crossing errors
# ================================================================

